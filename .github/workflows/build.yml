name: Build The Outcasts Live Scanner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download offline Tesseract language data
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main"
          DATA_DIR="app/src/main/assets/tessdata"
          mkdir -p "$DATA_DIR/script"

          download_model() {
            local model_path="$1"
            local destination="$DATA_DIR/$model_path"
            mkdir -p "$(dirname "$destination")"
            echo "Downloading $model_path"
            curl --fail --location --retry 3 --retry-delay 2 \
              "$BASE_URL/$model_path.traineddata" \
              --output "$destination"
            test -s "$destination"
          }

          download_model "eng"
          download_model "script/Latin"
          download_model "script/Arabic"
          download_model "script/Armenian"
          download_model "script/Bengali"
          download_model "script/Cyrillic"
          download_model "script/Devanagari"
          download_model "script/Georgian"
          download_model "script/Greek"
          download_model "script/HanS"
          download_model "script/HanT"
          download_model "script/Hangul"
          download_model "script/Hebrew"
          download_model "script/Japanese"
          download_model "script/Thai"
          download_model "script/Tamil"
          download_model "script/Telugu"
          download_model "script/Vietnamese"

      # Reject Git LFS pointer files or incomplete downloads before packaging.
      - name: Verify downloaded Tesseract models
        shell: bash
        run: |
          set -euo pipefail
          DATA_DIR="app/src/main/assets/tessdata"
          failed=0
          while IFS= read -r -d '' file; do
            size=$(stat -c%s "$file")
            echo "$file: $size bytes"
            if [ "$size" -lt 1000000 ]; then
              echo "::error::Model file is unexpectedly small; it may be an LFS pointer or incomplete download: $file"
              failed=1
            fi
            if head -c 200 "$file" | grep -q "git-lfs.github.com/spec"; then
              echo "::error::Git LFS pointer detected: $file"
              failed=1
            fi
          done < <(find "$DATA_DIR" -type f -name '*.traineddata' -print0)
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: outcasts-live-scanner
          path: app/build/outputs/apk/debug/app-debug.apk
