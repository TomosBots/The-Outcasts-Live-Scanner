name: Build The Outcasts Live Scanner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Start with a clean folder so old script models cannot be packaged.
      # Only the three language models used by the app are downloaded.
      - name: Download required Tesseract language data
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main"
          DATA_DIR="app/src/main/assets/tessdata"

          rm -rf "$DATA_DIR"
          mkdir -p "$DATA_DIR"

          for model in eng rus ara; do
            destination="$DATA_DIR/${model}.traineddata"
            echo "Downloading ${model}.traineddata"
            curl --fail --location --retry 3 --retry-delay 2 \
              "$BASE_URL/${model}.traineddata" \
              --output "$destination"
            test -s "$destination"
          done

      - name: Verify only required OCR models are present
        shell: bash
        run: |
          set -euo pipefail
          DATA_DIR="app/src/main/assets/tessdata"

          for model in eng rus ara; do
            file="$DATA_DIR/${model}.traineddata"
            test -s "$file"
            size=$(stat -c%s "$file")
            echo "$file: $size bytes"
            if [ "$size" -lt 1000000 ]; then
              echo "::error::${file} is unexpectedly small."
              exit 1
            fi
            if head -c 200 "$file" | grep -q "git-lfs.github.com/spec"; then
              echo "::error::Git LFS pointer detected: $file"
              exit 1
            fi
          done

          actual_count=$(find "$DATA_DIR" -type f -name '*.traineddata' | wc -l)
          if [ "$actual_count" -ne 3 ]; then
            echo "::error::Expected exactly 3 traineddata files, found $actual_count."
            find "$DATA_DIR" -type f -print
            exit 1
          fi

      - name: Build APK
        run: gradle assembleDebug

      - name: Verify APK archive
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          unzip -t "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: outcasts-live-scanner
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
